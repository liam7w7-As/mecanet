  <style>
/* ==== web/src/styles/modernize.css ==== */
/**
 * Primitivas visuales del diseno objetivo (Modernize).
 *
 * Origen: `web/designs/work/views.css`, que acompana al HTML de referencia y
 * trae las mismas clases con las medidas exactas que el diseno usa. Se porto
 * tal cual a proposito: las cifras (161px de alto en los KPI, 16px de padding
 * en tabla, radio 8px) salen medidas del original, no estimadas.
 *
 * Solo se migran a utilidades de Tailwind cuando exista un componente React
 * que las encapsule. Mientras tanto, estas clases son la fuente de verdad.

/* Modo oscuro: el diseno de referencia solo oscurece la cabecera de tabla.

/* Dialogs y Modales Modernize (de web/designs/work/modal-referencia.html) */
.app-dialog {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.15);
  max-width: calc(100vw - 32px);
  width: 520px;
  max-height: calc(100dvh - 40px);
  overflow: auto;
}
.app-dialog.wide-dialog {
  width: 720px;
}
.app-dialog.image-dialog {
  width: 850px;
}
.dialog-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.dialog-badge {
  height: 52px;
  width: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  background: var(--pale);
  color: var(--primary);
  flex-shrink: 0;
}
.dialog-badge.warning {
  background: var(--coral-pale);
  color: var(--coral);
}
.dialog-badge.success {
  background: var(--mint-pale);
  color: #00b99c;
}
.dialog-badge.gold {
  background: var(--gold-pale);
  color: var(--gold);
}
.dialog-buttons {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  padding: 9px 18px;
  font-weight: 600;
  font-size: 14px;
  border: 0;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.1s ease;
}
.primary-button:hover:not(:disabled) {
  filter: brightness(0.92);
}
.primary-button:active:not(:disabled) {
  transform: scale(0.98);
}
.primary-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.secondary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 18px;
  font-weight: 500;
  font-size: 14px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.secondary-button:hover:not(:disabled) {
  background: var(--pale);
  color: var(--primary);
}
.secondary-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.danger-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 8px;
  background: var(--coral);
  color: #fff;
  padding: 9px 18px;
  font-weight: 600;
  font-size: 14px;
  border: 0;
  cursor: pointer;
  transition: filter 0.15s ease;
}
.danger-button:hover:not(:disabled) {
  filter: brightness(0.92);
}
.danger-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.modal-details {
  margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
.modal-details dt {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.modal-details dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.form-control {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(93, 135, 255, 0.15);
}

/* Profile styles (de web/designs/work/perfil.html) */
.profile-head {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 24px;
}
.profile-cover {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: linear-gradient(135deg, #5d87ff 0%, #49beff 50%, #13deb9 100%);
}
.profile-overview {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 20px;
  flex-wrap: wrap;
  gap: 16px;
}
.profile-identity {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -50px;
  text-align: center;
}
.profile-picture {
  border-radius: 50%;
  padding: 4px;
  background: white;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  display: inline-block;
}

@media(max-width:700px){
  .table-page{padding-top:20px}
  .page-banner{height:105px;padding:20px;margin-bottom:20px}
  .page-banner h1{font-size:19px;max-width:240px}
  .page-banner img{right:-16px;width:125px;height:125px;opacity:.55}
  .breadcrumb{font-size:12px;gap:10px;position:relative;z-index:1}
  .view-panel-body{padding:16px}
  .view-panel-title{padding:16px}
  .order-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .orders-panel{padding:18px}
  .table-toolbar{padding:12px;gap:10px;flex-wrap:wrap}
  .table-footer{gap:12px;padding:14px 10px;justify-content:flex-end}
  .table-footer label{gap:8px}
  .page-controls{gap:0}
  .table-search{width:205px}
  .density{padding:18px 12px}
  .filter-bar{padding:0 12px 12px;gap:12px}
  .filter-bar label{flex-wrap:wrap}
  .record-details,.edit-grid{grid-template-columns:1fr}
  .undo-notice{bottom:76px}
  .orders-panel>.table-toolbar{padding-bottom:16px}
  .data-table{min-width:760px}
  .data-table.orders-table{min-width:1020px}
  .expanded-detail dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-two,.modal-details{grid-template-columns:1fr}
  .app-dialog{padding:20px;max-height:calc(100dvh - 24px)}
  .dialog-buttons{gap:8px}
}

/* Escala tipográfica del contenido (+1 punto / 1px bump). Sidebar queda intacto. */
.shell-main,
.app-dialog,
dialog,
[role="dialog"] {
  font-size: 15px;
}
.shell-main .text-xs,
.app-dialog .text-xs,
dialog .text-xs,
[role="dialog"] .text-xs {
  font-size: 13px;
  line-height: 1.35rem;
}
.shell-main .text-sm,
.app-dialog .text-sm,
dialog .text-sm,
[role="dialog"] .text-sm {
  font-size: 15px;
  line-height: 1.45rem;
}
.shell-main .text-base,
.app-dialog .text-base,
dialog .text-base,
[role="dialog"] .text-base {
  font-size: 17px;
  line-height: 1.6rem;
}
.shell-main .text-lg,
.app-dialog .text-lg,
dialog .text-lg,
[role="dialog"] .text-lg {
  font-size: 19px;
  line-height: 1.75rem;
}
.shell-main .text-xl,
.app-dialog .text-xl,
dialog .text-xl,
[role="dialog"] .text-xl {
  font-size: 21px;
  line-height: 1.85rem;
}
.shell-main .text-2xl,
.app-dialog .text-2xl,
dialog .text-2xl,
[role="dialog"] .text-2xl {
  font-size: 25px;
  line-height: 2.1rem;
}

/* Blindaje explícito para la barra lateral: no tocar sus tamaños de fuente */
.sidebar,
.sidebar .nav-item {
  font-size: 14px !important;
}
.sidebar .nav-heading {
  font-size: 12px !important;
}

/**
 * Primitivas del shell: barra lateral, barra superior, tarjetas, KPIs y botones.
 *
 * Origen: el bloque <style> de `web/designs/modernize.html`, que esta en disco

 * eliminaron los blobs base64: aqui solo viven medidas y colores.
 *
 * `EMBEDDED` marca los url() que el original resolvia con base64. La unica
 * fuente real del proyecto es la declarada en index.css.
 *
 * Se importa ANTES que modernize.css a proposito: las clases de la tabla y
 * los formularios estan iteradas despues y deben ganar cuando coinciden.
 *
 * Una regla se acota a proposito. La referencia usa
 *     main { margin-left: var(--sidebar) }
 * porque alli `main` es siempre el area de contenido junto al sidebar. En este
 * proyecto el login tambien usa `<main>` y heredaba los 270px, dejando una
 * banda blanca a la izquierda. Por eso aqui la clase es explicita: `.shell-main`.
 */

/* ==== web/src/styles/overrides.css ==== */
/**
 * Desviaciones de la aplicacion respecto al diseño de referencia.
 *
 * Va al FINAL del orden de import a proposito, y no al final de shell.css como
 * estaba antes: `modernize.css` se carga despues de `shell.css`, asi que una
 * variante definida en shell.css no podia ganarle a `.status-chip` y a las
 * demas clases de la tabla. Aqui ya no hay nada despues.
 *
 * Hay dos motivos para que una regla viva en este archivo y no en el CSS
 * portado:
 *
 *  1. ACCESIBILIDAD. La referencia pinta valor, etiqueta y chip con el acento
 *     claro sobre su pastel, y eso no llega al minimo de WCAG AA ni para texto
 *     grande. Medido: valor de KPI 1.94-2.94:1, `.status-chip` 2.94:1, chip
 *     gold 1.99:1, chip coral 2.08:1, blanco sobre `--primary` 3.29:1, blanco
 *     sobre `--cyan` 2.08:1. Se exige 4.5:1 (3:1 solo para texto grande).
 *     La identidad visual no se pierde: el fondo tenue y el icono de 50px
 *     siguen llevando el color, y los acentos claros se conservan para bordes,
 *     iconos y superficies sin texto.
 *
 *  2. CONTENIDO. Algunos componentes necesitan una caja que la referencia no
 *     tiene, porque nuestro contenido no es el del template (por ejemplo, los
 *     KPI llevan una linea de detalle extra).
 *
 * Para volver a la fidelidad estricta al template basta con borrar este
 * archivo, menos los bloques de contenido, que son estructurales.
 */

/* ---------------------------------------------------------------------------
 * Superficies de marca que llevan TEXTO BLANCO.
 * Los acentos claros de la referencia no llegan a 4.5:1 con blanco: primary
 * 3.29:1, cyan 2.08:1, coral 2.3:1. Para texto sobre fondo de marca se usa la
 * variante `Ink`, que es el mismo tono un paso mas profundo y llega a
 * 5.0-5.8:1. Los acentos claros se siguen usando para bordes, iconos y
 * superficies sin texto, que es donde el diseño los aprovecha.
 * ------------------------------------------------------------------------- */
:root {
  --primary-ink: #18335c;
  --cyan-ink: #0075b7;
  --coral-ink: #cd3007;
  --mint-ink: #0b826d;
  --gold-ink: #9c6400;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow-x: clip;
}

body,
#root,
.app-shell {
  min-height: 100vh;
  min-height: 100dvh;
}

.app-shell,
.shell-main,
.shell-main > .container {
  min-width: 0;
}

.shell-main > .container {
  width: 100%;
}

@media (max-width: 899.98px) {
  /* Keep Safari from zooming form controls; pinch-to-zoom remains available. */
  input:not([type='checkbox']):not([type='radio']):not([type='file']):not([type='hidden']),
  select,
  textarea {
    font-size: 16px !important;
  }

  .topbar {
    height: calc(64px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }

  .sidebar {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    max-width: calc(100vw - 24px);
  }

  .shell-main > .container {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}

.nav-item.active,
.primary-button,
.settings-trigger,
.products {
  background: var(--primary-ink);
}

.primary-button:hover,
.settings-trigger:hover {
  background: #204379;
}

.badge {
  background: var(--cyan-ink);
}

.cart-count {
  background: var(--coral-ink);
}

/* ---------------------------------------------------------------------------
 * Chips de estado: el texto va a la variante Ink sobre su pastel.
 * ------------------------------------------------------------------------- */
.status-chip {
  color: var(--primary-ink);
}

.status-chip.green {
  color: var(--mint-ink);
}

.status-chip.gold {
  color: var(--gold-ink);
}

.status-chip.red {
  color: var(--coral-ink);
}

.status-chip.sky {
  color: var(--cyan-ink);
}

.status-chip.gray {
  color: var(--muted);
}

.status-chip.solid {
  background: var(--mint-ink);
}

.status-chip.solid.red {
  background: var(--coral-ink);
}

/* El cuadrado de stock usa los mismos tintes que `.stat`, que en la referencia
 * solo existen para la tarjeta. */
.square-icon.gold {
  background: var(--gold-pale);
  color: var(--gold-ink);
}

.square-icon.coral {
  background: var(--coral-pale);
  color: var(--coral-ink);
}

/* ---------------------------------------------------------------------------
 * Adaptaciones de contenido.
 * ------------------------------------------------------------------------- */

/* Los KPI llevan una linea de detalle que la referencia no tiene, asi que no
 * caben en los 161px fijos de `.stat` (el contenido de la referencia ya suma
 * 115px contra 113px utiles). Se conserva todo lo demas -- radio, fondo tenue,
 * color heredado al icono -- y se deja que la altura la marque el contenido,
 * con 161px como minimo para que las tarjetas cortas no se vean flacas. */
.stat-auto {
  height: auto;
  min-height: 161px;
}

.stat-detail {
  margin-top: 4px;
  font-size: 12px;
  line-height: 16px;
}

.stat-value {
  color: var(--ink);
}

.stat-label {
  color: var(--muted);
}

/* El panel de notificaciones lleva encabezado y pie propios, asi que no puede
 * heredar el `padding:18px` de `.popover`. Comparte la superficie (borde,
 * radio, sombra, fondo) y solo ajusta el ancho que necesita la lista. Tampoco
 * se resuelve con utilidades de Tailwind: los CSS portados se importan
 * despues, asi que le ganarian por especificidad. */
.popover-notifications {
  width: 352px;
  max-width: calc(100vw - 24px);
  padding: 0;
}

@media (max-width: 600px) {
  .popover-notifications {
    width: min(352px, calc(100vw - 24px));
  }
}

/* Mismo motivo que la anterior: el menu de usuario son solo filas, sin marco
 * interior, asi que no usa el padding de 18px de `.popover`. */
.popover-menu {
  padding: 8px 0;
}

/* ---------------------------------------------------------------------------
 * Navegacion inferior fija (movil).
 *
 * Sustituye al cajón lateral como entrada principal en pantallas estrechas:
 * el cajón sigue disponible desde la pestaña "Más". Se muestra por debajo de
 * 900px, que es el ancho a partir del cual las tarjetas dejan de ser de una
 * sola columna y la barra estorba mas de lo que ayuda.
 *
 * `z-index: 36` es deliberado: por debajo del velo (38) y del cajón (40), para
 * que al abrir "Más" la barra quede atenuada y no tapar el menu, y por encima
 * del topbar (30).
 * ------------------------------------------------------------------------- */
.tabbar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 36;
  display: none;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(14px) saturate(1.6);
  -webkit-backdrop-filter: blur(14px) saturate(1.6);
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(23, 38, 60, 0.08);
}

body.dark .tabbar {
  background: rgba(32, 41, 54, 0.94);
}

.tabbar-inner {
  display: flex;
  gap: 2px;
  max-width: 560px;
  margin: 0 auto;
}

.tab-item {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px 4px;
  border: 0;
  background: transparent;
  border-radius: 14px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.18s ease, background-color 0.18s ease, transform 0.1s ease;
}

.tab-item .tab-icon {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 26px;
  border-radius: 999px;
  color: inherit;
  transition: background-color 0.18s ease, color 0.18s ease;
}

.tab-item .tab-icon svg {
  width: 20px;
  height: 20px;
}

.tab-item .tab-label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab-item:hover {
  color: var(--primary);
}

.tab-item:active {
  transform: scale(0.94);
}

.tab-item.active {
  color: var(--primary-ink);
}

.tab-item.active .tab-icon {
  background: var(--primary-ink);
  color: #fff;
}

/* Contador de pendientes: pastilla sobre el icono, con anillo del color de la
 * superficie para que no se pegue visualmente al icono. */
.tab-badge {
  position: absolute;
  top: -4px;
  right: 1px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--cyan-ink);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--surface);
}

/* El logotipo en el topbar solo existe cuando el cajón lateral es un drawer
 * (<=1199px); en escritorio la marca ya vive en el cajón. */
.topbar-brand {
  display: none;
}

@media (max-width: 1199.98px) {
  .topbar-brand {
    display: block;
    max-width: 112px;
    margin-left: 6px;
    margin-right: 8px;
    /* Sin esto la imagen no puede encogerse por debajo de su ancho intrínseco
     * y se pega (o solapa) con las acciones en pantallas de 320-360px. */
    min-width: 0;
    flex-shrink: 1;
  }
}

/* Barra visible y holgura para que el contenido no quede debajo de ella. */
@media (max-width: 899.98px) {
  .tabbar {
    display: block;
  }

  .shell-main .container {
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }

  /* Toasts y avisos flotantes suben de sitio para no quedar tapados. */
  .tabbar-safe {
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  }
}

@media print {
  .tabbar {
    display: none !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .tab-item,
  .tab-item .tab-icon {
    transition: none;
  }
}

/* ==== custom.css ==== */
/* ============================================================
   Capa propia del prototipo (clases con prefijo u-)
   ============================================================ */

body { background: #f7f9fc; }
.shell-main { min-height: calc(100vh - 70px); }
.shell-main > .container { padding-top: 30px; }

.u-initials {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--pale); color: var(--primary-ink); font-weight: 700; letter-spacing: .02em;
  border-radius: 50%; flex-shrink: 0;
}

/* ---------- Botones ---------- */
.u-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
  font-size: 14px; font-weight: 600; line-height: 1.1; white-space: nowrap;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
}
.u-btn:active { transform: scale(.98); }
.u-btn:disabled { opacity: .5; cursor: not-allowed; }
.u-btn-icon { width: 17px; height: 17px; }
.u-btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 7px; }

  const [id, clientId, vehicleId, workOrderId, estadoPago, offset, itemIds, paidRatio, archived] = seed;

const panel = (title, body, { subtitle = '', actions = '', className = '', bodyClass = '' } = {}) => `
  <section class="view-panel ${className}">
    ${title ? sectionTitle(title, subtitle, actions) : ''}
    <div class="view-panel-body ${bodyClass}">${body}</div>
  </section>`;

const emptyState = (title, text, iconName = 'inbox', action = '') => `
  <div class="u-empty">
    <span class="u-empty-icon">${icon(iconName)}</span>
    <strong>${esc(title)}</strong>
    <p>${esc(text)}</p>
    ${action}
  </div>`;

const button = (label, { variant = 'primary', iconName = '', action = '', attrs = '', size = '', className = '' } = {}) => {
  const cls = `u-btn u-btn-${variant} ${size === 'sm' ? 'u-btn-sm' : ''} ${className}`;
  const data = action ? `data-action="${esc(action)}"` : '';
  return `<button type="button" class="${cls}" ${data} ${attrs}>${iconName ? icon(iconName, 'u-btn-icon') : ''}<span>${esc(label)}</span></button>`;
};

const linkButton = (label, href, { variant = 'secondary', iconName = '', size = '', className = '' } = {}) => `
  <a href="${esc(href)}" class="u-btn u-btn-${variant} ${size === 'sm' ? 'u-btn-sm' : ''} ${className}">${iconName ? icon(iconName, 'u-btn-icon') : ''}<span>${esc(label)}</span></a>`;

const tabsHtml = (tabs, active, actionName, extra = '') => `
  <div class="u-tabs ${extra}" role="tablist">
    ${tabs.map(([value, label, count]) => `
      <button type="button" role="tab" aria-selected="${value === active}" class="u-tab ${value === active ? 'is-active' : ''}" data-action="${actionName}" data-value="${esc(value)}">
        ${esc(label)}${count !== undefined ? `<span class="u-tab-count">${count}</span>` : ''}
      </button>`).join('')}
  </div>`;

const pagination = (total, page, perPage, actionName) => {
  const pages = Math.max(1, Math.ceil(total / perPage));
  if (total === 0) return '';
  const current = clamp(page, 1, pages);
  const from = (current - 1) * perPage + 1;
  const to = Math.min(total, current * perPage);
  const numbers = [];
  for (let i = 1; i <= pages; i += 1) {
    if (i === 1 || i === pages || Math.abs(i - current) <= 1) numbers.push(i);
    else if (numbers[numbers.length - 1] !== '…') numbers.push('…');
  }
  return `
    <div class="table-footer">
      <span class="text-brand-muted">Mostrando ${from}–${to} de ${total}</span>
      <div class="page-controls">
        <button type="button" class="u-page-btn" data-action="${actionName}" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}>${icon('chevron-left')}</button>
        ${numbers.map((n) => n === '…'
          ? '<span class="u-page-ellipsis">…</span>'
          : `<button type="button" class="u-page-btn ${n === current ? 'is-active' : ''}" data-action="${actionName}" data-page="${n}">${n}</button>`).join('')}
        <button type="button" class="u-page-btn" data-action="${actionName}" data-page="${current + 1}" ${current === pages ? 'disabled' : ''}>${icon('chevron-right')}</button>
      </div>
    </div>`;
};

const field = (label, control, { hint = '', error = '', className = '', required = false } = {}) => `
  <label class="u-field ${className}">
    <span class="u-label">${esc(label)}${required ? ' <span class="u-required">*</span>' : ''}</span>
    ${control}
    ${error ? `<span class="u-error">${esc(error)}</span>` : hint ? `<span class="u-hint">${esc(hint)}</span>` : ''}
  </label>`;

const input = (name, value = '', { type = 'text', placeholder = '', attrs = '', className = '' } = {}) =>
  `<input class="u-input ${className}" id="field-${esc(name)}" name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs} />`;

const select = (name, options, value = '', { attrs = '', className = '' } = {}) => `
  <select class="u-input u-select ${className}" id="field-${esc(name)}" name="${esc(name)}" ${attrs}>
    ${options.map(([val, label]) => `<option value="${esc(val)}" ${String(val) === String(value) ? 'selected' : ''}>${esc(label)}</option>`).join('')}
  </select>`;

const textarea = (name, value = '', { rows = 3, placeholder = '', attrs = '', className = '' } = {}) =>
  `<textarea class="u-input u-textarea ${className}" id="field-${esc(name)}" name="${esc(name)}" rows="${rows}" placeholder="${esc(placeholder)}" ${attrs}>${esc(value)}</textarea>`;

const checkbox = (name, label, checked = false, attrs = '') => `
  <label class="u-check"><input type="checkbox" name="${esc(name)}" ${checked ? 'checked' : ''} ${attrs} /><span>${esc(label)}</span></label>`;

const formatCurrentDate = () => {
  const formatted = new Intl.DateTimeFormat('es-CL', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  }).format(NOW);
  return formatted.charAt(0).toUpperCase() + formatted.slice(1);
};

const ROUTES = {
  dashboard: { module: 'taller', label: 'Dashboard' },
  reports: { module: 'finanzas', label: 'Reportes' },
  'work-orders': { module: 'taller', label: 'Taller / OT' },
  vehicles: { module: 'taller', label: 'Vehículos' },
  warehouses: { module: 'almacen', label: 'Almacenes' },
  quotations: { module: 'comercial', label: 'Comercial / Cotizaciones' },
  clients: { module: 'comercial', label: 'Clientes' },
  catalog: { module: 'taller', label: 'Catálogo' },
  finance: { module: 'finanzas', label: 'Finanzas / Contabilidad' },
  users: { module: 'admin', label: 'Usuarios' },
  settings: { module: 'admin', label: 'Configuración' },
  notfound: { module: 'taller', label: 'No encontrado' },
  forbidden: { module: 'taller', label: 'Sin acceso' },
};

const parseRoute = () => {
  const raw = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = Object.fromEntries(new URLSearchParams(queryPart || ''));
  const name = parts[0] || 'dashboard';
  let id = null;
  let tab = null;
  if (['work-orders', 'vehicles', 'quotations', 'clients'].includes(name) && parts[1]) {
    if (parts[1] === 'new') id = 'new';
    else id = Number(parts[1]);
  }
  if (parts[2]) tab = parts[2];
  return { name: ROUTES[name] ? name : 'notfound', id, tab, query, raw };
};

const navigate = (path) => {
  const target = path.startsWith('#') ? path : `#${path}`;
  if (location.hash === target) render();
  else location.hash = target;
};

const canAccess = (route) => {
  const meta = ROUTES[route.name];
  if (!meta) return true;
  if (route.name === 'forbidden' || route.name === 'notfound') return true;
  return can(meta.module, 'read');
};

      <h3 class="text-base font-semibold">Notificaciones</h3>

    </div>
    <div class="u-notification-list">
      ${notifications.map((n) => `
        <a href="${n.link}" class="u-notification ${n.leida ? '' : 'is-unread'}" data-nav data-mark-notification="${n.id}">
          <span class="u-notification-icon">${icon({ pago: 'wallet', stock: 'package-x', taller: 'wrench', almacen: 'warehouse', comercial: 'receipt-text' }[n.tipo] || 'bell')}</span>

const mobileTabbar = () => {
  const tabs = [
    ['/dashboard', 'gauge', 'Inicio', badgeCounts.dashboard],
    ['/work-orders', 'clipboard-list', 'OTs', badgeCounts.workOrders],
    ['/quotations', 'receipt-text', 'Cotiz.', badgeCounts.quotations],
    ['/vehicles', 'car', 'Vehículos', 0],
  ];
  const moreActive = !tabs.some(([path]) => isActive(path));
  return `
    <nav class="tabbar" aria-label="Navegación principal (móvil)">
      <div class="tabbar-inner">
        ${tabs.map(([path, iconName, label, badge]) => `
          <a href="#${path}" data-nav class="tab-item ${isActive(path) ? 'active' : ''}">
            <span class="tab-icon">${icon(iconName)}${badge > 0 ? `<span class="tab-badge">${badge > 99 ? '99+' : badge}</span>` : ''}</span>
            <span class="tab-label">${label}</span>
          </a>`).join('')}
        <button type="button" class="tab-item ${moreActive ? 'active' : ''}" data-action="open-sidebar" aria-label="Abrir todas las secciones">
          <span class="tab-icon">${icon('layout-grid')}</span><span class="tab-label">Más</span>
        </button>
      </div>
    </nav>`;
};

/* ------------------------------ Modal y toast ------------------------------ */

const openModal = (type, data = {}) => {
  state.modalStack.push({ type, data });
  state.menu = null;
  render();
  document.body.style.overflow = 'hidden';
};
const closeModal = () => {
  state.modalStack.pop();
  document.body.style.overflow = state.modalStack.length ? 'hidden' : '';
  render();
};
const closeAllModals = () => {
  state.modalStack = [];
  document.body.style.overflow = '';
  render();
};
const toast = (message, tone = 'success', title = '') => {
  state.toast = { message, tone, title, id: Date.now() };
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    if (state.toast && state.toast.id) {
      state.toast = null;
      render();
    }
  }, 3600);
};
let toastTimer = null;

const modalFrame = (title, body, { footer = '', size = '', subtitle = '', iconName = '', tone = '' } = {}) => `
  <div class="u-modal-backdrop" data-action="close-modal">
    <div class="u-modal ${size ? `u-modal-${size}` : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-modal-card>
      <div class="u-modal-head">
        <div class="flex min-w-0 items-center gap-3">
          ${iconName ? `<span class="u-modal-icon ${tone}">${icon(iconName)}</span>` : ''}
          <div class="min-w-0">
            <h2 class="truncate">${esc(title)}</h2>
            ${subtitle ? `<p class="text-sm text-brand-muted">${esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <button type="button" class="icon-button" data-action="close-modal" aria-label="Cerrar">${icon('x')}</button>
      </div>
      <div class="u-modal-body">${body}</div>
      ${footer ? `<div class="u-modal-footer">${footer}</div>` : ''}
    </div>
  </div>`;

const toastHtml = () => state.toast ? `
  <div class="u-toast u-toast-${esc(state.toast.tone)}" role="status">
    <span class="u-toast-icon">${icon(state.toast.tone === 'error' ? 'alert-circle' : state.toast.tone === 'info' ? 'info' : 'check-circle-2')}</span>
    <span class="min-w-0"><strong>${esc(state.toast.title || (state.toast.tone === 'error' ? 'No se pudo completar' : state.toast.tone === 'info' ? 'Información' : 'Listo'))}</strong><span>${esc(state.toast.message)}</span></span>
    <button type="button" class="u-toast-close" data-action="dismiss-toast" aria-label="Cerrar">${icon('x')}</button>
  </div>` : '';

/* ------------------------------ Render ------------------------------ */

function render(options = {}) {
  if (typeof refreshDerived === 'function') refreshDerived();
  const active = document.activeElement;
  const activeId = active?.id;
  const start = active?.selectionStart;
  const end = active?.selectionEnd;
  chartQueue.length = 0;

  const content = viewHtml();
  app.innerHTML = shellHtml(content) + toastHtml() + (state.modalStack.length ? modalHtml() : '');
  document.body.classList.toggle('sidebar-open', state.sidebarOpen);
  document.body.style.overflow = state.modalStack.length ? 'hidden' : '';

  if (window.lucide) window.lucide.createIcons();
  initCharts();

  if (options.preserveFocus !== false && activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === 'function') {
      el.focus({ preventScroll: true });
      if (start != null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(start, end); } catch { /* noop */ }
      }
    }
  }
}

function initCharts() {
  chartQueue.forEach(({ id, config }) => {
    const canvas = document.getElementById(id);
    if (!canvas || !window.Chart) return;
    if (canvas._chart) canvas._chart.destroy();
    canvas._chart = new window.Chart(canvas, config);
  });
}

const queueChart = (id, config) => chartQueue.push({ id, config });

function match(text, search) {
  if (!search) return true;
  return String(text || '').toLowerCase().includes(String(search).toLowerCase());
}

const perPage = 8;
const currentPage = (total, page) => clamp(Number(page) || 1, 1, Math.max(1, Math.ceil(total / perPage)));

window.addEventListener('hashchange', () => {
  state.route = parseRoute();
  state.menu = null;
  state.rowMenu = null;
  state.modalStack = [];
  state.sidebarOpen = false;
  document.body.style.overflow = '';
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
});

const ENTRY_LABELS = { normal: 'Ingreso normal', garantia: 'Garantía', reingreso: 'Reingreso' };
const OPERATIONAL_LABELS = { pendiente: 'Pendiente', en_progreso: 'En progreso', esperando_repuesto: 'Esperando repuesto', finalizada: 'Finalizada' };
const OPERATIONAL_TONES = { pendiente: 'gray', en_progreso: 'sky', esperando_repuesto: 'gold', finalizada: 'green' };

const woProgress = (wo) => {
  if (!wo.items.length) return 0;
  return Math.round(wo.items.filter((item) => item.estadoOperativo === 'finalizada').length / wo.items.length * 100);
};
const woPaidChip = (wo) => {
  if (!wo.quotation) return statusChip('Sin cotización', 'gray');
  const q = wo.quotation;
  if (q.estadoPago === 'total' || q.estadoPago === 'ot_finalizado') return statusChip('Pagada', 'green');
  if (q.estadoPago === 'parcial') return statusChip('Abono parcial', 'gold');
  if (q.estadoPago === 'por_verificar') return statusChip('Por verificar', 'sky');
  return statusChip('Por pagar', 'red');
};
const matchesDateFilter = (date, filter) => {
  if (!filter || filter === 'all') return true;
  const value = new Date(date).getTime();
  if (filter === '3d') return value >= daysAgo(3).getTime();
  if (filter === '15d') return value >= daysAgo(15).getTime();
  if (filter === 'month') return new Date(date).getMonth() === NOW.getMonth() && new Date(date).getFullYear() === NOW.getFullYear();
  return true;
};

/* ------------------------------ Listado ------------------------------ */

const filteredWorkOrders = () => {
  const filters = state.filters.workOrders;
  let list = workOrders.slice();
  if (state.sessionRole === 'mecanico') list = list.filter((wo) => wo.mechanicId === 4 || wo.mechanicId === 5);
  list = list.filter((wo) => {
    const vehicle = vehicleById(wo.vehicleId);
    const client = clientById(wo.clientId);
    return match(wo.codigo, filters.search) || match(vehicle?.patente, filters.search)
      || match(vehicle ? vehicleLabel(vehicle) : '', filters.search)
      || match(client?.nombre, filters.search) || match(wo.descripcion, filters.search);
  });
  if (filters.status !== 'all') list = list.filter((wo) => wo.estado === filters.status);
  list = list.filter((wo) => matchesDateFilter(wo.fechaIngreso, filters.date));
  return list.sort((a, b) => new Date(b.fechaIngreso) - new Date(a.fechaIngreso));
};

  return {
    step: 0,
    clientId,
    vehicleId,
    contact: { nombre: client?.nombre || '', telefono: client?.telefono || '', email: client?.email || '' },
    billing: { razonSocial: client?.nombre || '', rut: client?.rut || '', giro: client?.tipo === 'empresa' ? 'Servicios y transporte' : 'Persona natural', direccion: client?.direccion || '', email: client?.email || '' },
    sameBilling: true,
    tipoIngreso: vehicle ? (state.wizard?.draft?.tipoIngreso || 'normal') : 'normal',
    coberturaGarantia: false,
    kmIngreso: vehicle ? String(vehicle.kilometraje) : '',
    inspection: {
      nivelCombustible: '1/2',
      neumaticos: { delanteroIzquierdo: 'Bueno', delanteroDerecho: 'Bueno', traseroIzquierdo: 'Bueno', traseroDerecho: 'Bueno' },
      inventario: { llaveRepuesto: true, gata: true, triangulo: true, extintor: false, radio: true, alfombras: true, cargador: false },
      objetosValor: '', observaciones: '', fotos: [null, null, null, null, null, null],
    },
    items: [],
    mechanicId: 3,
    notas: '',
    errors: {},
    clientSearch: '', vehicleSearch: '', catalogSearch: '',
  };
};

const ensureWizard = () => {
  if (!state.wizard) state.wizard = { draft: emptyWizard() };
  return state.wizard.draft;
};

const wizardTotals = () => {
  const draft = ensureWizard();
  const subtotal = sum(draft.items, (item) => item.cantidad * item.precioUnitario);
  return { subtotal, total: subtotal };
};

const vehicleCompleteness = (vehicle) => {
  const fields = [vehicle.patente, vehicle.marca, vehicle.modelo, vehicle.anio, vehicle.vin, vehicle.motor, vehicle.kilometraje, vehicle.clientId];
  return Math.round(fields.filter(Boolean).length / fields.length * 100);
};

/* ------------------------------ Cotizaciones: listado ------------------------------ */

const QUOTATION_FILTERS = [
  ['all', 'Todas'], ['sin_ot', 'Sin OT'], ['por_pagar', 'Por pagar'], ['parcial', 'Abono parcial'],
  ['total', 'Pagadas total'], ['por_verificar', 'Por verificar'], ['archived', 'Archivadas'],
];

const filteredQuotations = () => {
  const f = state.filters.quotations;
  let list = quotations.slice();
  if (state.sessionRole === 'vendedor') list = list.filter((q) => q.asesorId === 6);
  list = list.filter((q) => {
    const client = clientById(q.clientId);
    const vehicle = vehicleById(q.vehicleId);
    return match(q.codigo, f.search) || match(client?.nombre, f.search) || match(client?.rut, f.search) || match(vehicle?.patente, f.search);
  });
  if (f.status === 'archived') list = list.filter((q) => q.archived);
  else if (f.status === 'sin_ot') list = list.filter((q) => !q.archived && !q.workOrderId);
  else if (f.status !== 'all') list = list.filter((q) => !q.archived && q.estadoPago === f.status);
  else list = list.filter((q) => !q.archived);
  if (f.from) list = list.filter((q) => new Date(q.createdAt) >= new Date(`${f.from}T00:00:00`));
  if (f.to) list = list.filter((q) => new Date(q.createdAt) <= new Date(`${f.to}T23:59:59`));
  return list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
};

const viewQuotations = () => {
  const f = state.filters.quotations;
  const list = filteredQuotations();
  const page = currentPage(list.length, f.page);
  const pageItems = list.slice((page - 1) * perPage, page * perPage);
  const total = sum(list, (q) => q.total);
  const paid = sum(list, (q) => q.pagado);
  const balance = sum(list, (q) => Math.max(0, q.total - q.pagado));
  const counts = Object.fromEntries(QUOTATION_FILTERS.map(([value]) => {
    if (value === 'all') return [value, quotations.filter((q) => !q.archived).length];
    if (value === 'archived') return [value, quotations.filter((q) => q.archived).length];
    if (value === 'sin_ot') return [value, quotations.filter((q) => !q.archived && !q.workOrderId).length];
    return [value, quotations.filter((q) => !q.archived && q.estadoPago === value).length];
  }));
  return `

      ${pageBanner('Comercial / Cotizaciones', 'Seguimiento de cotizaciones, pagos y conversión a órdenes de trabajo.', 'Comercial',

            ${field('', `<input class="u-input" id="quotation-from" type="date" value="${esc(f.from)}" data-filter="quotation-from" aria-label="Desde" />`, { className: 'u-date-field' })}
            ${field('', `<input class="u-input" id="quotation-to" type="date" value="${esc(f.to)}" data-filter="quotation-to" aria-label="Hasta" />`, { className: 'u-date-field' })}

          </div>
        </div>
        ${pageItems.length ? `
          <div class="data-scroll">
            <table class="data-table">
              <thead><tr><th>#</th><th>Cotización</th><th>Cliente</th><th>Estado pago</th><th>Emitida</th><th class="text-right">Total</th><th class="text-right">Pagado</th><th class="text-right">Saldo</th><th class="text-right">Acciones</th></tr></thead>
              <tbody>
                ${pageItems.map((q, index) => {
                  const client = clientById(q.clientId);
                  const vehicle = vehicleById(q.vehicleId);
                  const wo = q.workOrderId ? workOrderById(q.workOrderId) : null;
                  const attention = !q.workOrderId && q.estadoPago === 'por_pagar';
                  return `<tr class="${attention ? 'selected' : ''}">
                    <td class="text-brand-muted">${(page - 1) * perPage + index + 1}</td>
                    <td class="nowrap">
                      <a href="#/quotations/${q.id}" data-nav class="font-semibold text-brand-ink">${esc(q.codigo)}</a>
                      <div class="u-small u-muted">${wo ? `<a href="#/work-orders/${wo.id}" data-nav class="u-link">${esc(wo.codigo)}</a>` : 'Sin OT'}${vehicle ? ` · ${esc(vehicle.patente)}` : ''}</div>
                    </td>
                    <td><div class="person"><span class="u-initials avatar" style="width:32px;height:32px;font-size:11px">${esc(initials(client?.nombre || '?'))}</span><div class="min-w-0"><strong>${esc(client?.nombre || 'Sin cliente')}</strong><p class="u-small u-muted">${esc(client?.rut || '—')}</p></div></div></td>
                    <td>${quotationChip(q)}</td>
                    <td class="whitespace-nowrap text-brand-muted">${fmtDate(q.createdAt)}</td>
                    <td class="text-right amount">${money(q.total)}</td>

                    <td class="text-right ${q.saldoPendiente > 0 ? 'u-money-negative' : 'u-money-positive'}">${money(q.saldoPendiente)}</td>
                    <td class="text-right"><div class="u-table-actions">${quotationRowMenu(q)}</div></td>

};

/* ------------------------------ Cotizaciones: creación ------------------------------ */

const emptyQuotationDraft = (clientId = null, vehicleId = null) => ({
  clientId, vehicleId, clientSearch: '', vehicleSearch: '', catalogSearch: '',
  formaPago: 'transferencia', disponibilidadTrabajo: 'Inmediata', validezDias: 30,
  descuentoTipo: 'porcentaje', descuentoValor: 0, asesorId: 6, notas: '',
  items: [], errors: {},
});
const ensureQuotationDraft = () => {
  if (!state.quotationDraft) state.quotationDraft = { draft: emptyQuotationDraft() };
  return state.quotationDraft.draft;
};
const quotationDraftTotals = (draft) => {
  const subtotal = sum(draft.items, (item) => item.cantidad * item.precioUnitario);
  const descuento = draft.descuentoTipo === 'porcentaje' ? Math.round(subtotal * Number(draft.descuentoValor || 0) / 100) : Number(draft.descuentoValor || 0);
  return { subtotal, descuento: Math.min(subtotal, descuento), total: Math.max(0, subtotal - Math.min(subtotal, descuento)) };
};

const quotationClientBlock = (draft) => {
  const results = draft.clientSearch ? clients.filter((c) => match(c.nombre, draft.clientSearch) || match(c.rut, draft.clientSearch)).slice(0, 5) : [];
  const selected = draft.clientId ? clientById(draft.clientId) : null;
  return `
    <div class="u-search" style="margin-bottom:8px">${icon('search')}<input class="u-input" id="qd-client-search" placeholder="Buscar cliente por nombre o RUT…" value="${esc(draft.clientSearch)}" data-action="qd-client-search" autocomplete="off" /></div>
    ${results.length ? `<div class="u-quick-results" style="margin-bottom:10px">${results.map((c) => `<button type="button" class="u-quick-item" data-action="qd-select-client" data-id="${c.id}"><span class="u-icon-box">${icon(c.tipo === 'empresa' ? 'building-2' : 'user-round')}</span><span class="min-w-0"><strong>${esc(c.nombre)}</strong><small>${esc(c.rut)} · ${esc(c.email)}</small></span>${icon('arrow-right', 'u-quick-arrow')}</button>`).join('')}</div>` : ''}
    ${selected ? `<div class="u-selected-card">${avatar(null, selected.nombre, 40)}<div class="min-w-0 flex-1"><strong>${esc(selected.nombre)}</strong><span>${esc(selected.rut)} · ${esc(selected.telefono)}</span><span>${esc(selected.email)}</span></div><button type="button" class="u-table-action" data-action="qd-clear-client">${icon('x')}</button></div>` : `<p class="u-small u-muted">Selecciona un cliente para asociar la cotización.</p>`}
    <button type="button" class="u-btn u-btn-secondary u-btn-sm" data-action="open-client-form" data-from-quotation="1" style="margin-top:10px">${icon('user-plus', 'u-btn-icon')}Crear cliente</button>`;
};

    ${results.length ? `<div class="u-quick-results" style="margin-bottom:10px">${results.map((v) => `<button type="button" class="u-quick-item" data-action="qd-select-vehicle" data-id="${v.id}"><span class="u-plate">${esc(v.patente)}</span><span class="min-w-0"><strong>${esc(vehicleLabel(v))}</strong><small>${esc(clientById(v.clientId)?.nombre || 'Sin cliente')}</small></span>${icon('arrow-right', 'u-quick-arrow')}</button>`).join('')}</div>` : ''}

      : `<div class="u-empty" style="padding:26px"><span class="u-empty-icon">${icon('package-plus')}</span><strong>Sin ítems cotizados</strong><p>Agrega servicios o repuestos desde el catálogo.</p><button type="button" class="u-btn u-btn-secondary u-btn-sm" data-action="qd-add-manual">${icon('plus', 'u-btn-icon')}Ítem manual</button></div>`}

const catalogTypeLabel = (type) => ({ parte: 'Repuesto / parte', estandar: 'Servicio estándar', especifico: 'Servicio específico' }[type]);
const catalogAvailability = (item) => {
  if (item.tipo === 'especifico') return statusChip('Servicio', 'green', 'round');
  if (item.stock <= 0) return statusChip('Sin stock', 'red', 'round');
  if (item.stock <= item.stockMinimo) return statusChip(`Bajo mínimo · ${item.stock}`, 'gold', 'round');
  return statusChip(`${item.stock} u.`, 'green', 'round');
};

  const f = state.filters.catalog;

    const matchesTab = f.tab === 'all' || item.tipo === f.tab;

/* ============================================================
   Modales y documentos simulados
   ============================================================ */

const modalHtml = (modal = state.modalStack[state.modalStack.length - 1]) => {
  if (!modal) return '';
  const { type, data = {} } = modal;
  switch (type) {
    case 'clientForm': return clientFormModal(data);
    case 'clientDelete': return deleteConfirmModal('cliente', data.id, 'confirm-delete-client');
    case 'vehicleForm': return vehicleFormModal(data);
    case 'vehicleDelete': return deleteConfirmModal('vehículo', data.id, 'confirm-delete-vehicle');
    case 'workOrderQuick': return workOrderQuickModal(data.id);
    case 'workOrderStatus': return workOrderStatusModal(data.id);
    case 'workOrderDelivery': return workOrderDeliveryModal(data.id);
    case 'workOrderCancel': return workOrderCancelModal(data.id);
    case 'workOrderRevert': return workOrderRevertModal(data.id);
    case 'workOrderItems': return workOrderItemsModal(data.id);
    case 'workOrderInspection': return workOrderInspectionModal(data.id);
    case 'workOrderBilling': return workOrderBillingModal(data.id);
    case 'workOrderMechanic': return workOrderMechanicModal(data.id);
    case 'photo': return photoModal(data.id, data.index);
    case 'pdf': return pdfModal(data.kind, data.id);
    case 'quotationEdit': return quotationEditModal(data.id);
    case 'payment': return paymentModal(data.id);
    case 'paymentVoid': return paymentVoidModal(data.id, data.payment);
    case 'catalogForm': return catalogFormModal(data.id);
    case 'catalogDetail': return catalogDetailModal(data.id);
    case 'catalogDelete': return deleteConfirmModal('ítem del catálogo', data.id, 'confirm-delete-catalog');
    case 'stockAdjust': return stockAdjustModal(data.id);
    case 'warehouseForm': return warehouseFormModal(data.id);
    case 'stockMovement': return stockMovementModal(data.warehouseId);
    case 'stockTransfer': return stockTransferModal();
    case 'warehouseDelivery': return warehouseDeliveryModal(data.id);
    case 'cashMovement': return cashMovementModal(data.type || 'ingreso');
    case 'cashVoid': return cashVoidModal(data.id);
    case 'transferReview': return transferReviewModal(data.id);
    case 'cashClose': return cashCloseModal();
    case 'userForm': return userFormModal(data.id);
    case 'userDelete': return deleteConfirmModal('usuario', data.id, 'confirm-delete-user');
    case 'profile': return profileModal();
    case 'help': return helpModal();
    case 'confirm': return confirmModal(data);
    default: return '';
  }
};

/* ------------------------------ Genéricos ------------------------------ */

const confirmModal = ({ title = 'Confirmar acción', message = '', confirmLabel = 'Confirmar', confirmAction = '', id = null, tone = 'gold', iconName = 'alert-circle' } = {}) => modalFrame(

const photoModal = (id, index) => {
  const wo = workOrderById(id);
  if (!wo) return '';
  const labels = ['Delantera', 'Trasera', 'Lateral izquierdo', 'Lateral derecho', 'Interior', 'Tablero'];
  return modalFrame(`Foto · ${labels[index] || 'Vehículo'}`, `
    <div class="u-photo-large">
      <div class="u-photo-placeholder">${icon('car', 'u-photo-car')}<span>${esc(vehicleById(wo.vehicleId)?.patente || '')}</span><small>Imagen de referencia · ${esc(labels[index] || '')}</small></div>
    </div>
    <p class="u-small u-muted" style="margin-top:10px">En la aplicación real esta foto fue tomada durante la recepción del ${fmtDateTime(wo.fechaIngreso)}. Aquí se muestra un marcador porque el prototipo no incluye archivos de imagen.</p>`, {
    size: 'xl', iconName: 'image', subtitle: `${wo.codigo} · ${labels[index] || ''}`,
    footer: `<button type="button" class="u-btn u-btn-secondary" data-action="close-modal">Cerrar</button>`,
  });
};

const pdfModal = (kind, id) => {
  let title = 'Documento';
  let code = '';
  let meta = '';
  let body = '';
  if (kind === 'quotation') {
    const q = quotationById(id);
    if (!q) return '';
    const client = clientById(q.clientId);
    const vehicle = vehicleById(q.vehicleId);
    title = 'Cotización'; code = q.codigo; meta = fmtDate(q.createdAt);
    body = `
      ${documentHeader(title, code, `Emitida ${fmtDate(q.createdAt)}`)}
      <div class="u-doc-grid"><div><small>Cliente</small><strong>${esc(client?.nombre || '—')}</strong><span>${esc(client?.rut || '')}</span><span>${esc(client?.direccion || '')}</span></div><div><small>Vehículo</small><strong>${esc(vehicle ? `${vehicle.patente} · ${vehicleLabel(vehicle)}` : 'Sin vehículo')}</strong><span>${vehicle ? `${vehicle.kilometraje.toLocaleString('es-CL')} km · ${vehicle.color}` : ''}</span></div></div>
      <table class="u-doc-table"><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${q.items.map((item) => `<tr><td>${esc(item.descripcion)}</td><td>${item.cantidad}</td><td>${money(item.precioUnitario)}</td><td>${money(item.subtotal)}</td></tr>`).join('')}</tbody></table>
      <div class="u-doc-totals"><div><span>Subtotal</span><strong>${money(q.subtotal)}</strong></div><div><span>Descuento</span><strong>-${money((q.subtotal || q.total) - q.total)}</strong></div><div class="u-doc-total"><span>Total</span><strong>${money(q.total)}</strong></div><div><span>Pagado</span><strong>${money(q.pagado)}</strong></div><div><span>Saldo</span><strong>${money(q.saldoPendiente)}</strong></div></div>
      <p class="u-doc-note">Forma de pago: ${esc({ transferencia: 'Transferencia bancaria', efectivo: 'Efectivo', efectivo_transferencia: 'Efectivo o transferencia', a_convenir: 'A convenir' }[q.formaPago] || q.formaPago)} · Validez ${q.validezDias} días.<br>${esc(q.notas || '')}</p>`;
  } else if (kind === 'work-order') {
    const wo = workOrderById(id);
    if (!wo) return '';
    const vehicle = vehicleById(wo.vehicleId);
    const client = clientById(wo.clientId);
    title = 'Orden de trabajo'; code = wo.codigo; meta = fmtDate(wo.fechaIngreso);
    body = `
      ${documentHeader(title, code, `Ingreso ${fmtDate(wo.fechaIngreso)}`)}
      <div class="u-doc-grid"><div><small>Cliente</small><strong>${esc(client?.nombre || '—')}</strong><span>${esc(client?.rut || '')}</span><span>${esc(client?.telefono || '')}</span></div><div><small>Vehículo</small><strong>${esc(vehicle ? `${vehicle.patente} · ${vehicleLabel(vehicle)}` : '—')}</strong><span>${wo.kilometrajeIngreso.toLocaleString('es-CL')} km · ${esc(vehicle?.combustible || '')}</span></div></div>
      <p class="u-doc-note"><strong>Motivo:</strong> ${esc(wo.descripcion)}</p>
      <table class="u-doc-table"><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${wo.items.map((item) => `<tr><td>${esc(item.descripcion)}</td><td>${item.cantidad}</td><td>${money(item.precioUnitario)}</td><td>${money(item.subtotal)}</td></tr>`).join('')}</tbody></table>
      <div class="u-doc-totals"><div class="u-doc-total"><span>Total estimado</span><strong>${money(wo.subtotal)}</strong></div></div>
      <p class="u-doc-note">Estado: ${WORK_ORDER_STATUS[wo.estado].label} · Mecánico: ${esc(userById(wo.mechanicId).nombre)}<br>Firma cliente: ____________________  Firma taller: ____________________</p>`;
  } else if (kind === 'reception') {
    const wo = workOrderById(id);
    if (!wo) return '';
    const vehicle = vehicleById(wo.vehicleId);
    title = 'Comprobante de recepción'; code = wo.codigo; meta = fmtDateTime(wo.fechaIngreso);
    body = `
      ${documentHeader(title, code, fmtDateTime(wo.fechaIngreso))}
      <div class="u-doc-grid"><div><small>Vehículo</small><strong>${esc(vehicle?.patente || '—')} · ${esc(vehicle ? vehicleLabel(vehicle) : '')}</strong><span>${wo.kilometrajeIngreso.toLocaleString('es-CL')} km · ${esc(wo.inspection.nivelCombustible)} combustible</span></div><div><small>Cliente</small><strong>${esc(clientById(wo.clientId)?.nombre || '—')}</strong><span>${esc(wo.contact.telefono)}</span></div></div>
      <h3 style="font-size:13px;margin:16px 0 8px">Estado del vehículo</h3>
      <table class="u-doc-table"><tbody>
        <tr><td>Neumático delantero izquierdo</td><td>${esc(wo.inspection.neumaticos.delanteroIzquierdo)}</td><td>Neumático delantero derecho</td><td>${esc(wo.inspection.neumaticos.delanteroDerecho)}</td></tr>
        <tr><td>Neumático trasero izquierdo</td><td>${esc(wo.inspection.neumaticos.traseroIzquierdo)}</td><td>Neumático trasero derecho</td><td>${esc(wo.inspection.neumaticos.traseroDerecho)}</td></tr>
      </tbody></table>
      <p class="u-doc-note"><strong>Objetos de valor:</strong> ${esc(wo.inspection.objetosValor)}<br><strong>Observaciones:</strong> ${esc(wo.inspection.observaciones)}</p>
      <div class="u-doc-signatures"><div>Firma cliente</div><div>Firma recepción</div></div>`;

function viewHtml() {
  const route = state.route;
  if (!canAccess(route)) return viewForbidden();
  switch (route.name) {
    case 'dashboard': return viewDashboard();
    case 'work-orders':
      if (route.id === 'new') return viewWorkOrderCreate();
      if (route.id) return viewWorkOrderDetail(route.id);
      return viewWorkOrders();
    case 'vehicles':
      if (route.id) return viewVehicleDetail(route.id);
      return viewVehicles();
    case 'quotations':
      if (route.id === 'new') return viewQuotationCreate();
      if (route.id) return viewQuotationDetail(route.id);
      return viewQuotations();
    case 'clients': return viewClients();
    case 'catalog': return viewCatalog();
    case 'warehouses': return viewWarehouses();
    case 'finance': return viewFinance();
    case 'reports': return viewReports();
    case 'users': return viewUsers();
    case 'settings': return viewSettings();
    case 'forbidden': return viewForbidden();
    default: return viewNotFound();
  }
}

const num = (value, fallback = 0) => {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
};
const formObject = (form) => Object.fromEntries(new FormData(form).entries());
const isChecked = (form, name) => Boolean(form.elements.namedItem(name)?.checked);
const dataId = (el) => {
  const value = Number(el.dataset.id);
  return Number.isFinite(value) ? value : null;
};
const nextId = (list) => list.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
const todayStamp = () => iso(NOW);
const setDeep = (target, path, value) => {
  const keys = path.split('.');
  let cursor = target;
  keys.slice(0, -1).forEach((key) => {
    if (!cursor[key] || typeof cursor[key] !== 'object') cursor[key] = {};
    cursor = cursor[key];
  });
  cursor[keys[keys.length - 1]] = value;
};

function refreshDerived() {
  dashboard.metrics.activeWorkOrders = workOrders.filter((wo) => wo.estado === 'en_progreso').length;
  dashboard.metrics.waitingForParts = workOrders.filter((wo) => wo.estado === 'esperando_repuesto').length;
  dashboard.metrics.pendingBalance = sum(quotations.filter((q) => !q.archived), (q) => Math.max(0, q.total - q.pagado));
  dashboard.metrics.pendingQuotations = quotations.filter((q) => !q.archived && q.estadoPago === 'por_pagar').length;
  dashboard.metrics.quotationsWithoutWorkOrder = quotations.filter((q) => !q.archived && !q.workOrderId).length;

const recalcQuotation = (quotation) => {
  quotation.items.forEach((line) => {
    line.subtotal = num(line.cantidad) * num(line.precioUnitario);
  });
  quotation.subtotal = sum(quotation.items, (line) => line.subtotal);
  const rawDiscount = quotation.descuentoTipo === 'porcentaje'
    ? Math.round(quotation.subtotal * num(quotation.descuentoValor) / 100)
    : num(quotation.descuentoValor);
  const discount = Math.min(quotation.subtotal, Math.max(0, rawDiscount));
  quotation.total = Math.max(0, quotation.subtotal - discount);
  quotation.pagado = sum(quotation.payments.filter((payment) => !payment.anulado), (payment) => payment.monto);
  quotation.saldoPendiente = Math.max(0, quotation.total - quotation.pagado);
  if (quotation.total > 0 && quotation.pagado >= quotation.total) quotation.estadoPago = 'total';
  else if (quotation.pagado > 0) quotation.estadoPago = 'parcial';
  else quotation.estadoPago = 'por_pagar';
  return quotation;
};

/* ------------------------------ Descargas ------------------------------ */

const downloadCsv = (filename, headers, rows) => {
  const escapeCell = (cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`;
  const csv = [headers, ...rows].map((row) => row.map(escapeCell).join(';')).join('\r\n');
  const blob = new Blob([`\uFEFF${csv}`], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
};

const documentHtml = () => {
  const doc = document.querySelector('.u-doc');
  if (!doc) return '';
  const styles = Array.from(document.querySelectorAll('style')).map((style) => style.outerHTML).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Documento UNITHOR</title>${styles}<style>body{background:#eef3f8;padding:24px}.u-doc{max-width:820px;margin:0 auto;background:#fff}.u-doc-foot{margin-top:24px}</style></head><body>${doc.outerHTML}</body></html>`;
};

const downloadDocument = () => {
  const html = documentHtml();
  if (!html) return toast('No hay un documento abierto para descargar.', 'error');
  const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'documento-unithor.html';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
  toast('Documento descargado como HTML (demo).', 'success');
};

const printDocument = () => {
  const html = documentHtml();
  if (!html) return toast('No hay un documento abierto para imprimir.', 'error');
  const popup = window.open('', '_blank');
  if (!popup) return toast('Habilita las ventanas emergentes para imprimir.', 'error');
  popup.document.write(html);
  popup.document.close();
  popup.focus();
  setTimeout(() => popup.print(), 350);
};

const addCatalogLine = (lines, item, quantity = 1) => {
  const existing = lines.find((line) => line.catalogItemId === item.id);
  if (existing) {
    existing.cantidad += quantity;
    return existing;
  }
  const line = {
    id: nextId(lines),
    catalogItemId: item.id,
    codigo: item.codigo,
    nombre: item.nombre,
    descripcion: item.nombre,
    tipo: item.tipo,
    cantidad: quantity,
    precioUnitario: item.precio,
    subtotal: item.precio * quantity,
    estadoOperativo: 'pendiente',
    notas: '',
  };
  lines.push(line);
  return line;
};

/* ------------------------------ Stock ------------------------------ */

const applyStockMovement = (warehouseId, catalogItemId, tipo, cantidad, motivo) => {
  const item = itemById(catalogItemId);
  if (!item) return null;
  const warehouse = warehouseById(warehouseId);
  if (!warehouse) return null;
  let balance = stockBalances.find((row) => row.warehouseId === warehouseId && row.catalogItemId === catalogItemId);
  if (!balance) {
    balance = { id: nextId(stockBalances), warehouseId, catalogItemId, cantidad: 0 };
    stockBalances.push(balance);
  }
  const quantity = Math.max(0, num(cantidad));
  let delta = 0;
  if (tipo === 'ajuste') delta = quantity - balance.cantidad;
  else if (['ingreso', 'traslado_ingreso'].includes(tipo)) delta = quantity;
  else delta = -quantity;
  const nextQuantity = Math.max(0, balance.cantidad + delta);
  delta = nextQuantity - balance.cantidad;
  balance.cantidad = nextQuantity;
  item.stock = Math.max(0, item.stock + delta);
  stockMovements.unshift({
    id: nextId(stockMovements),
    warehouseId,
    catalogItemId,
    tipo,
    cantidad: delta,
    saldoResultante: nextQuantity,
    motivo: motivo || 'Movimiento de bodega',
    createdAt: todayStamp(),
    usuarioId: state.user.id,
  });
  return { balance, delta, nextQuantity };
};

const doConfirm = (name, id) => {
  if (name === 'confirm-create-wo') {
    createWorkOrderFromWizard();
    return;
  }
  if (name === 'confirm-delete-client') {
    const index = clients.findIndex((client) => client.id === id);
    if (index >= 0) {
      clients.splice(index, 1);
      vehicles.filter((vehicle) => vehicle.clientId === id).forEach((vehicle) => { vehicle.clientId = null; });
      closeAllModals();
      toast('Cliente eliminado de la demo.');
    }
    return;
  }
  if (name === 'confirm-delete-vehicle') {
    const index = vehicles.findIndex((vehicle) => vehicle.id === id);
    if (index >= 0) {
      vehicles.splice(index, 1);
      workOrders.filter((wo) => wo.vehicleId === id).forEach((wo) => { wo.vehicleId = null; });
      quotations.filter((q) => q.vehicleId === id).forEach((q) => { q.vehicleId = null; });
      closeAllModals();
      toast('Vehículo eliminado de la demo.');
    }
    return;
  }
  if (name === 'confirm-delete-catalog') {
    const index = catalog.findIndex((item) => item.id === id);
    if (index >= 0) {
      catalog.splice(index, 1);
      closeAllModals();
      toast('Ítem del catálogo eliminado.');
    }
    return;
  }
  if (name === 'confirm-delete-user') {
    const index = users.findIndex((user) => user.id === id);
    if (index >= 0) {
      users.splice(index, 1);
      closeAllModals();
      toast('Usuario eliminado de la demo.');
    }
    return;
  }
  if (name === 'confirm-delete-quotation') {
    const index = quotations.findIndex((quotation) => quotation.id === id);
    if (index >= 0) {
      quotations.splice(index, 1);
      closeAllModals();
      toast('Cotización eliminada de la demo.');

  }

};

const verifyTransfer = (id) => {
  const index = pendingTransfers.findIndex((transfer) => transfer.id === id);
  if (index < 0) return;
  const transfer = pendingTransfers[index];
  const quotation = quotationById(transfer.quotationId);
  if (quotation) {
    quotation.payments.push({
      id: nextId(quotation.payments),
      quotationId: quotation.id,
      monto: transfer.monto,
      metodo: 'transferencia',
      estado: 'confirmado',
      referencia: `TRF-${transfer.numeroTransaccion}`,
      bancoOrigen: transfer.bancoOrigen,
      numeroTransaccion: transfer.numeroTransaccion,
      createdAt: iso(NOW),
      createdBy: state.user.id,
      notas: 'Transferencia verificada desde finanzas.',
    });
    quotation.estadoPago = 'total';
    recalcQuotation(quotation);
    if (quotation.pagado >= quotation.total) quotation.estadoPago = 'total';
  }
  pendingTransfers.splice(index, 1);
  closeAllModals();
  toast('Transferencia verificada y pago confirmado.');
};

const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[char]));

const updateRole = (role) => {
  if (!ROLE_PERMISSIONS[role]) return;
  state.sessionRole = role;
  const representative = users.find((user) => user.role === role && user.activo);
  if (representative) state.user = representative;
  if (!canAccess(state.route)) {
    navigate('/dashboard');
    toast(`Ahora ves la demo como ${roleLabel(role)}.`, 'info');
    return;
  }
  render();
  toast(`Ahora ves la demo como ${roleLabel(role)}.`, 'info');
};

        return matchesType && matchesMethod && new Date(movement.createdAt) >= new Date(`${f.from}T00:00:00`) && new Date(movement.createdAt) <= new Date(`${f.to}T23:59:59`);
      }).map((movement) => [

      if (Object.keys(quoteDraft.errors).length) {
        render();
        toast('Completa cliente e ítems antes de crear la cotización.', 'error');

      createQuotationFromDraft();

      const draft = ensureWizard();
      const client = clientById(id);
      if (!client) break;
      draft.clientId = client.id;
      draft.clientSearch = '';
      draft.contact = { nombre: client.nombre, telefono: client.telefono, email: client.email };

        razonSocial: client.nombre, rut: client.rut,
        giro: client.tipo === 'empresa' ? 'Servicios y transporte' : 'Persona natural',
        direccion: client.direccion, email: client.email,
      };
      if (draft.vehicleId && vehicleById(draft.vehicleId)?.clientId !== client.id) draft.vehicleId = null;
      render();
      break;
    }
    case 'wizard-clear-client': ensureWizard().clientId = null; render(); break;
    case 'wizard-vehicle-search': ensureWizard().vehicleSearch = el.value; render(); break;
    case 'wizard-select-vehicle': {
      const draft = ensureWizard();
      const vehicle = vehicleById(id);
      if (!vehicle) break;
      draft.vehicleId = vehicle.id;
      draft.vehicleSearch = '';
      draft.kmIngreso = String(vehicle.kilometraje);
      if (!draft.clientId) draft.clientId = vehicle.clientId;
      render();
      break;
    }
    case 'wizard-clear-vehicle': ensureWizard().vehicleId = null; render(); break;
    case 'wizard-catalog-search': ensureWizard().catalogSearch = el.value; render(); break;
    case 'wizard-add-item': {
      const draft = ensureWizard();
      const item = itemById(id);
      if (item) addCatalogLine(draft.items, item);
      draft.catalogSearch = '';
      render();
      break;
    }
    case 'wizard-remove-item': ensureWizard().items.splice(num(el.dataset.index), 1); render(); break;
    case 'wizard-add-manual': addManualLine(ensureWizard().items, 'Servicio adicional'); render(); toast('Ítem manual agregado. Edita su descripción y precio.', 'info'); break;
    case 'wizard-back': {
      const draft = ensureWizard();
      draft.step = Math.max(0, draft.step - 1);
      draft.errors = {};
      render();
      break;
    }
    case 'wizard-next': {
      const draft = ensureWizard();
      draft.errors = {};
      if (draft.step === 0 && !draft.clientId) draft.errors.client = true;
      if (draft.step === 2) {
        if (!draft.vehicleId) draft.errors.vehicle = true;
        if (!String(draft.kmIngreso || '').trim()) draft.errors.km = true;
      }
      if (Object.keys(draft.errors).length) {
        render();
        toast('Revisa los campos obligatorios para continuar.', 'error');
        break;
      }
      draft.step = Math.min(4, draft.step + 1);
      render();
      break;
    }
    case 'wizard-submit': {
      const draft = ensureWizard();
      draft.errors = {};
      if (!draft.clientId) draft.errors.client = true;
      if (!draft.vehicleId) draft.errors.vehicle = true;
      if (!String(draft.kmIngreso || '').trim()) draft.errors.km = true;
      if (!draft.items.length) draft.errors.items = true;
      if (Object.keys(draft.errors).length) {
        draft.step = draft.errors.items ? 4 : draft.errors.client ? 0 : 2;
        render();
        toast('Faltan datos obligatorios en el formulario.', 'error');
        break;
      }
      const totals = wizardTotals();
      openModal('confirm', {
        title: 'Crear orden de trabajo',
        message: `Se creará la OT para ${clientById(draft.clientId)?.nombre || 'el cliente'} con ${draft.items.length} ítem(s) por ${money(totals.total)}.`,
        confirmLabel: 'Crear orden', confirmAction: 'confirm-create-wo', tone: 'green', iconName: 'wrench',
      });
      break;
    }
    case 'new-wo-for-vehicle': openWizardForVehicle(id); break;
    case 'new-quotation-for-vehicle': openQuotationForVehicle(id); break;
    default: break;
  }
};

const applyFilter = (name, value, checked) => {
  const f = state.filters;
  switch (name) {
    case 'wo-search': f.workOrders.search = value; f.workOrders.page = 1; break;
    case 'wo-date': f.workOrders.date = value; f.workOrders.page = 1; break;
    case 'vehicle-search': f.vehicles.search = value; f.vehicles.page = 1; break;
    case 'quotation-search': f.quotations.search = value; f.quotations.page = 1; break;
    case 'quotation-from': f.quotations.from = value; f.quotations.page = 1; break;
    case 'quotation-to': f.quotations.to = value; f.quotations.page = 1; break;
    case 'client-search': f.clients.search = value; f.clients.page = 1; break;
    case 'catalog-search': f.catalog.search = value; f.catalog.page = 1; break;
    case 'catalog-only-stock': f.catalog.onlyStock = checked; f.catalog.page = 1; break;
    case 'warehouse-request-search': f.warehouses.search = value; break;
    case 'warehouse-stock-search': f.warehouses.movementSearch = value; break;
    case 'finance-from': f.finance.from = value; break;
    case 'finance-to': f.finance.to = value; break;
    case 'finance-method': f.finance.method = value; break;
    case 'finance-type': f.finance.movementType = value; break;
    case 'report-search': f.reports.search = value; break;
    case 'report-from': f.reports.from = value; break;
    case 'report-to': f.reports.to = value; break;
    case 'user-search': f.users.search = value; break;
    case 'user-role': f.users.role = value; break;
    case 'user-status': f.users.status = value; break;
    default: break;
  }
  render();
};

    toast('La bodega de origen y destino deben ser distintas.', 'error');
    return;
  }
  const balance = stockBalances.find((row) => row.warehouseId === from && row.catalogItemId === itemId);

  applyStockMovement(from, itemId, 'traslado_salida', quantity, data.motivo || 'Traslado entre bodegas');

  const movement = {
    id: nextId(cashMovements), tipo: data.tipo, categoria: data.categoria,
    monto: isIncome ? amount : -amount, metodo: data.metodo, referencia: data.referencia || `MOV-${Date.now().toString().slice(-6)}`,
    descripcion: data.descripcion || (isIncome ? 'Ingreso manual' : 'Egreso manual'),

  };
  cashMovements.unshift(movement);
  if (data.metodo === 'efectivo') {

  }
  closeModal();

/* ------------------------------ Eventos globales ------------------------------ */

document.addEventListener('click', (event) => {
  const nav = event.target.closest('[data-nav]');
  if (nav) {
    event.preventDefault();
    if (nav.dataset.markNotification) {
      const notification = notifications.find((item) => item.id === Number(nav.dataset.markNotification));
      if (notification) notification.leida = true;
    }
    state.menu = null;
    state.rowMenu = null;
    const href = nav.getAttribute('href');
    if (href) navigate(href);
    return;
  }

  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) {
    if (state.menu || state.rowMenu !== null) {
      state.menu = null;
      state.rowMenu = null;
      render();
    }
    return;
  }

  const action = actionEl.dataset.action;
  if (action === 'close-modal' && actionEl.classList.contains('u-modal-backdrop') && event.target !== actionEl) return;

  if (state.rowMenu !== null && action !== 'toggle-row-menu') state.rowMenu = null;
  handleAction(action, actionEl);
});

document.addEventListener('input', (event) => {
  const el = event.target;
  if (!(el instanceof HTMLElement)) return;

  if (el.dataset.filter) {
    applyFilter(el.dataset.filter, el.value, el.checked);
    return;
  }
  if (el.dataset.action === 'quick-search') {
    state.quickSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'wo-items-search') {
    state.woItemsSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'wizard-client-search') {
    ensureWizard().clientSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'wizard-vehicle-search') {
    ensureWizard().vehicleSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'wizard-catalog-search') {
    ensureWizard().catalogSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'qd-client-search') {
    ensureQuotationDraft().clientSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'qd-vehicle-search') {
    ensureQuotationDraft().vehicleSearch = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'qd-catalog-search') {
    ensureQuotationDraft().catalogSearch = el.value;
    render();
    return;
  }
  if (el.dataset.qdField) {
    const raw = el.type === 'checkbox' ? el.checked : el.value;
    setDeep(ensureQuotationDraft(), el.dataset.qdField, raw);
    render();
    return;
  }
  if (el.dataset.wizardField) {
    const raw = el.type === 'checkbox' ? el.checked : el.type === 'number' || el.dataset.wizardField === 'mechanicId' ? num(el.value) : el.value;
    setDeep(ensureWizard(), el.dataset.wizardField, raw);
    render();
    return;
  }
  if (el.dataset.settings) {
    if (!state.settingsDraft) state.settingsDraft = clone(settings);
    state.settingsDraft[el.dataset.settings] = el.value;
  }
});

document.addEventListener('change', (event) => {
  const el = event.target;
  if (!(el instanceof HTMLElement)) return;

  if (el.id === 'role-switcher') {
    updateRole(el.value);
    return;
  }
  if (el.dataset.action === 'select-permission-role') {
    state.permissionRole = el.value;
    render();
    return;
  }
  if (el.dataset.action === 'logo-upload') {
    const file = el.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      toast('Selecciona un archivo de imagen.', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      state.logoData = String(reader.result);
      render();
      toast('Logo cargado. Guarda la configuración para aplicarlo.', 'info');
    };
    reader.readAsDataURL(file);
    return;
  }
  if (el.dataset.filter) {
    applyFilter(el.dataset.filter, el.value, el.checked);
    return;
  }

  const wizardItemIndex = el.dataset.wizardItemQty ?? el.dataset.wizardItemPrice;
  if (wizardItemIndex !== undefined) {
    const draft = ensureWizard();
    const index = num(wizardItemIndex);
    if (draft.items[index]) {
      if (el.dataset.wizardItemQty !== undefined) draft.items[index].cantidad = Math.max(1, num(el.value, 1));
      if (el.dataset.wizardItemPrice !== undefined) draft.items[index].precioUnitario = Math.max(0, num(el.value));
    }
    render();
    return;
  }

  const qdItemIndex = el.dataset.qdItemQty ?? el.dataset.qdItemPrice ?? el.dataset.qdItemStatus ?? el.dataset.qdItemDesc;
  if (qdItemIndex !== undefined) {
    const draft = ensureQuotationDraft();
    const index = num(qdItemIndex);
    if (draft.items[index]) {
      if (el.dataset.qdItemQty !== undefined) draft.items[index].cantidad = Math.max(1, num(el.value, 1));
      if (el.dataset.qdItemPrice !== undefined) draft.items[index].precioUnitario = Math.max(0, num(el.value));
      if (el.dataset.qdItemStatus !== undefined) draft.items[index].estadoOperativo = el.value;
      if (el.dataset.qdItemDesc !== undefined) draft.items[index].descripcion = el.value;
    }
    render();
    return;
  }

  const woItemIndex = el.dataset.woItemQty ?? el.dataset.woItemPrice ?? el.dataset.woItemStatus;
  if (woItemIndex !== undefined) {
    const index = num(woItemIndex);
    if (state.woItemsDraft?.[index]) {
      if (el.dataset.woItemQty !== undefined) state.woItemsDraft[index].cantidad = Math.max(1, num(el.value, 1));
      if (el.dataset.woItemPrice !== undefined) state.woItemsDraft[index].precioUnitario = Math.max(0, num(el.value));
      if (el.dataset.woItemStatus !== undefined) state.woItemsDraft[index].estadoOperativo = el.value;
      state.woItemsDraft[index].subtotal = num(state.woItemsDraft[index].cantidad) * num(state.woItemsDraft[index].precioUnitario);
    }
    render();
    return;
  }

  if (el.dataset.wizardPhoto !== undefined) {
    const file = el.files?.[0];
    if (!file) return;
    const index = num(el.dataset.wizardPhoto);
    const reader = new FileReader();
    reader.onload = () => {
      ensureWizard().inspection.fotos[index] = String(reader.result);
      render();
    };
    reader.readAsDataURL(file);
    return;
  }

  if (el.dataset.wizardField) {
    const raw = el.type === 'checkbox' ? el.checked : el.dataset.wizardField === 'mechanicId' ? num(el.value) : el.value;
    setDeep(ensureWizard(), el.dataset.wizardField, raw);
    render();
    return;
  }

  if (el.dataset.qdField) {
    const raw = el.type === 'checkbox' ? el.checked : el.value;
    setDeep(ensureQuotationDraft(), el.dataset.qdField, raw);
    render();
    return;
  }

  if (el.dataset.perm) {
    const [moduleKey, action] = el.dataset.perm.split(':');
    const role = state.permissionRole;
    const current = new Set(state.permissions[role][moduleKey] || []);
    if (el.checked) current.add(action);
    else current.delete(action);
    state.permissions[role][moduleKey] = PERMISSION_ACTIONS.map(([key]) => key).filter((key) => current.has(key));
    render();
  }
});

document.addEventListener('submit', (event) => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  switch (form.dataset.form) {
    case 'client': handleClientForm(form); break;
    case 'vehicle': handleVehicleForm(form); break;
    case 'wo-status': handleWorkOrderStatus(form); break;
    case 'wo-delivery': handleWorkOrderDelivery(form); break;
    case 'wo-cancel': handleWorkOrderCancel(form); break;
    case 'wo-revert': handleWorkOrderRevert(form); break;
    case 'wo-inspection': handleWorkOrderInspection(form); break;
    case 'wo-billing': handleWorkOrderBilling(form); break;
    case 'quotation-edit': handleQuotationEdit(form); break;
    case 'payment': handlePayment(form); break;
    case 'payment-void': handlePaymentVoid(form); break;
    case 'catalog': handleCatalogForm(form); break;
    case 'stock-adjust': handleStockAdjust(form); break;
    case 'warehouse': handleWarehouseForm(form); break;
    case 'stock-movement': handleStockMovement(form); break;
    case 'stock-transfer': handleStockTransfer(form); break;
    case 'warehouse-delivery': handleWarehouseDelivery(form); break;
    case 'cash-movement': handleCashMovement(form); break;
    case 'cash-void': handleCashVoid(form); break;
    case 'cash-close': handleCashClose(form); break;
    case 'user': handleUserForm(form); break;
    default: break;
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (state.modalStack.length) closeModal();
    else if (state.sidebarOpen) { state.sidebarOpen = false; render(); }
    else if (state.menu || state.rowMenu !== null) { state.menu = null; state.rowMenu = null; render(); }
  }
});


/* ==== main.js ==== */
/* ============================================================
   Arranque del prototipo
   ============================================================ */

(function boot() {
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  state.route = parseRoute();
  render();
})();

  </script>
</body>
